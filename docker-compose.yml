services:
  postgres:
    image: postgres:16-alpine
    container_name: flowpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowpay
      POSTGRES_PASSWORD: flowpaysecret
      POSTGRES_DB: flowpay
    ports:
      - "5433:5432"
    volumes:
      - flowpay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpay -d flowpay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flowpay-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - flowpay-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flowpay-pgdata:
  flowpay-redisdata:
